[defaults]
#inventory = inventory/hosts.yml
#remote_user = username

# Paths
# Full path: ~/Code/provision/resources/ansible_collections/gummigudm/repos
#collections_path = ~/Code/provision/resources
#roles_path = ~/Code/provision/resources

# Ansible managed comment
#ansible_managed = Ansible managed

# Checking
host_key_checking = True

# Retry
retry_files_enabled = False

# Diff
diff_always = False

# Cows
nocows = 1

# Warnings
deprecation_warnings = True
devel_warning = False
system_warnings = False
action_warnings = False

# Color
#nocolor = 1

[colors]
#highlight = white
#verbose = blue
#warn = bright purple
#error = red
#debug = dark gray
#deprecate = purple
#skip = cyan
#unreachable = red
#ok = green
#changed = yellow
#diff_add = green
#diff_remove = red
#diff_lines = cyan

role_skeleton=~/Code/provision/skeletons/role
role_skeleton_ignore="^.git$"
